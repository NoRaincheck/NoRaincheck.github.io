# prek configuration — https://prek.j178.dev/
# Run manually with: prek run -a

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

# Fail fast if the site no longer builds.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "hugo-build"
name = "hugo build"
language = "system"
entry = "hugo --gc --quiet"
pass_filenames = false
types_or = ["markdown", "toml", "html", "css"]
